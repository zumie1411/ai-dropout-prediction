<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Career Assessment</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>

<div class="assessment-container">

<h1>Career Assessment 🧠</h1>

<p>
Rate yourself from 1 to 5
</p>


<form method="POST">


<label>
How much do you enjoy Coding?
</label>

<select name="coding">

<option value="1">1 - Not Interested</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5 - Very Interested</option>

</select>



<label>
How strong are you in Mathematics?
</label>

<select name="math">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>



<label>
How interested are you in Design?
</label>

<select name="design">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>



<label>
How good are your Communication Skills?
</label>

<select name="communication">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>



<label>
How good are you at Problem Solving?
</label>

<select name="problem_solving">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>



<label>
How interested are you in Technology?
</label>

<select name="technology">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>


<button type="submit">

Analyze My Career 🚀

</button>


</form>

</div>

</body>

</html>
