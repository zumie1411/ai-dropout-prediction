<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Career Result</title>

<link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">

</head>


<body>

<div class="result-container">

<h1>Your Career Recommendations 🎯</h1>


{% for item in careers %}

<div class="career-card">

<h2>
{{ item.career }}
</h2>


<div class="progress">

<div
class="progress-bar"
style="width: {{ item.percentage }}%"
>

{{ item.percentage }}%

</div>

</div>


</div>

{% endfor %}


<a href="/dashboard">

<button>

Back to Dashboard

</button>

</a>

</div>

</body>

</html>
